<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0b74de" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0366b6" stop-opacity="0.75"/>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="b"/>
      <feBlend in="SourceGraphic" in2="b"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="#082033" />

  <g filter="url(#s)">
    <circle cx="300" cy="220" r="220" fill="rgba(255,255,255,0.06)" />
    <circle cx="1200" cy="700" r="360" fill="url(#g)" opacity="0.18" />
    <ellipse cx="900" cy="180" rx="420" ry="120" fill="#0b74de" opacity="0.06" />
  </g>

  <g fill="#ffffff" fill-opacity="0.06">
    <rect x="40" y="600" width="420" height="180" rx="18"/>
    <rect x="220" y="120" width="280" height="90" rx="12"/>
  </g>

  <text x="50%" y="52%" dominant-baseline="middle" text-anchor="middle" fill="#ffffff" fill-opacity="0.06" font-family="Verdana, Geneva, Tahoma, sans-serif" font-size="72">STOR_APP</text>
</svg>
