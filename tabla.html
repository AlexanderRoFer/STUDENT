<!--tabla en la pagina web  <table>.-->
  <table id="Table">
    <!--se realiza el encabezado de la tabla con etiqueta <thead> y los <tr> son 
      las filas y los <th> lo que lleva cada fila dentro en este caso serian tres filas. -->
    <thead>
      <tr>
        <th>cuando </th>
        <th>quien </th>
        <th>Donde</th>
      </tr>
    </thead>
    <!--la etiqueta <tbody> es el complemento de las filas creadas en la etiqueta enterior 
      la cual rellena cada celda con los <td> en cada >th> -->
    <tbody>
      <td>JUAN</td>
      <td> 15 </td>
      <td> cali </td>
    </tbody>
  </table>
</body>
